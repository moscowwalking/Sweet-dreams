<!doctype html>
<html lang="ru" class="memories-html">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Memories — Карта воспоминаний</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ff69b4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sweet Dreams" />
    <link rel="apple-touch-icon" href="image/apple-touch-icon.png" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="memories.css?v=2.2" />
    <link rel="stylesheet" href="mobile.css?v=2.2" />
  </head>
  <body class="memories-page">
    <h1 class="title">
      <span>К</span><span>а</span><span>р</span><span>т</span><span>а</span>
      <span> </span>
      <span>в</span><span>о</span><span>с</span><span>п</span><span>о</span
      ><span>м</span><span>и</span><span>н</span><span>а</span><span>н</span
      ><span>и</span><span>й</span>
    </h1>

    <div id="map">
      <div class="upload-panel" id="uploadPanel">
        <label class="upload-btn" for="fileInput">Загрузить фото</label>
        <input
          id="fileInput"
          type="file"
          accept="image/*,image/heif,image/heic"
          multiple
          style="display: none"
        />
        <div id="dropArea" class="drop-area">
          Перетащи фото сюда или нажми «Загрузить»
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="nav-wrapper">
      <a href="index.html" class="nav-button">← Назад</a>
    </div>

    <!-- Love Counter -->
    <div class="love-counter" id="loveCounter">
      <div class="counter-item">
        <span class="counter-value" id="totalMemories">0</span>
        <span class="counter-label">воспоминаний</span>
      </div>
      <div class="counter-divider">❤️</div>
      <div class="counter-item">
        <span class="counter-value" id="totalDays">0</span>
        <span class="counter-label">дней вместе</span>
      </div>
    </div>

    <!-- Gallery Overlay -->
    <div id="overlay" class="overlay">
      <div class="gallery">
        <button id="closeGallery" class="close-button">×</button>
        <h2 id="placeTitle" class="gallery-date">Без даты</h2>
        <div class="photo-container">
          <img id="galleryMain" src="" alt="Фото воспоминания" />
        </div>
        <div id="thumbs" class="thumbs"></div>
      </div>
    </div>

    <!-- Floating Action Controls -->
    <div class="floating-controls">
      <div
        class="fab-btn random-memory-btn"
        id="randomMemoryBtn"
        title="Случайное воспоминание"
      >
        ✨
      </div>
      <div
        class="fab-btn nostalgia-btn-fab"
        id="nostalgiaBtn"
        style="display: none"
        title="В этот день..."
      >
        ⏳
        <span class="fab-badge" id="nostalgiaBadge" style="display: none"
          >1</span
        >
      </div>
      <div
        class="fab-btn notification-btn-fab"
        id="notificationBellBtn"
        style="display: none"
        title="Включить уведомления"
      >
        🔔
      </div>
    </div>

    <!-- Mobile Bottom Action Bar (Только для телефонов) -->
    <nav class="mobile-bottom-bar" id="mobileBottomBar">
      <a href="index.html" class="bottom-bar-item" title="На главную">
        <span class="bottom-bar-icon">🏠</span>
        <span class="bottom-bar-label">Главная</span>
      </a>

      <button
        class="bottom-bar-item"
        id="mobileRandomBtn"
        type="button"
        title="Случайное воспоминание"
      >
        <span class="bottom-bar-icon">✨</span>
        <span class="bottom-bar-label">Случайное</span>
      </button>

      <label
        class="bottom-bar-item center-action"
        for="fileInput"
        title="Загрузить фото"
      >
        <div class="center-action-btn">
          <svg
            class="center-action-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            ></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <span class="bottom-bar-label">Добавить</span>
      </label>

      <button
        class="bottom-bar-item"
        id="mobileNostalgiaBtn"
        type="button"
        title="В этот день..."
      >
        <span class="bottom-bar-icon">
          ⏳
          <span
            class="bottom-bar-badge"
            id="mobileNostalgiaBadge"
            style="display: none"
            >1</span
          >
        </span>
        <span class="bottom-bar-label">В этот день</span>
      </button>

      <button
        class="bottom-bar-item"
        id="mobileOverviewBtn"
        type="button"
        title="Вся карта"
      >
        <span class="bottom-bar-icon">🗺️</span>
        <span class="bottom-bar-label">Обзор</span>
      </button>
    </nav>

    <!-- Nostalgia Card ("В этот день...") -->
    <div class="nostalgia-card" id="nostalgiaCard">
      <div class="nostalgia-header">
        <span class="nostalgia-badge" id="nostalgiaTag">В этот день</span>
        <button class="nostalgia-close" id="nostalgiaCloseBtn" title="Закрыть">
          ×
        </button>
      </div>
      <div class="nostalgia-image-container" id="nostalgiaImgContainer">
        <img id="nostalgiaImg" src="" alt="Фото воспоминания" />
      </div>
      <div class="nostalgia-nav" id="nostalgiaNav">
        <button
          class="nostalgia-nav-btn"
          id="nostalgiaPrevBtn"
          title="Предыдущее фото"
        >
          ‹
        </button>
        <span class="nostalgia-counter" id="nostalgiaCounter">1 из 1</span>
        <button
          class="nostalgia-nav-btn"
          id="nostalgiaNextBtn"
          title="Следующее фото"
        >
          ›
        </button>
      </div>
      <div class="nostalgia-body">
        <div class="nostalgia-date" id="nostalgiaDate">...</div>
        <div class="nostalgia-caption" id="nostalgiaCaption">...</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <button class="nostalgia-btn" id="nostalgiaActionBtn">
          Полететь к месту 🚀
        </button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>

    <!-- Firebase SDK (Firestore Realtime) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyACf9FK-WZUDfJKgD47LOg7UK6-QsJlxDA",
        authDomain: "walking-98102.firebaseapp.com",
        projectId: "walking-98102",
        storageBucket: "walking-98102.firebasestorage.app",
        messagingSenderId: "1074232422683",
        appId: "1:1074232422683:web:24bad34fe39453282863be",
        measurementId: "G-SHCJ69NQ6N",
      };

      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.FirebaseFirestore = { db, collection, onSnapshot };
        window.dispatchEvent(new CustomEvent("firebase-ready"));
      } catch (e) {
        console.warn("⚠️ Firebase init warning:", e);
      }
    </script>

    <!-- App Logic -->
    <script src="memories.js?v=2.2"></script>
  </body>
</html>
