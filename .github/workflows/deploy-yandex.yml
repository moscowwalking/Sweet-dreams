name: Build & Push Server Docker Image to Yandex Registry

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-yandex.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Yandex Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t cr.yandex/crpshhg7kvbulth8ml7n/sweet-dreams-server:latest ./server

      - name: Push Docker image
        run: |
          docker push cr.yandex/crpshhg7kvbulth8ml7n/sweet-dreams-server:latest
