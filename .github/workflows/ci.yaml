name: testing_ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    name: Проверка синтаксиса и сборки
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Установка серверных зависимостей
        run: |
          cd server
          npm install
      - name: Проверка синтаксиса файлов
        run: |
          echo "Проверяем клиентский код"
          node -c memories.js
          node -c sw.js
          echo "Проверяем серверный код"
          node -c server/server.js
          node -c server/config/env.js
          node -c server/routes/places.js
          node -c server/routes/notifications.js
          node -c server/routes/health.js
          node -c server/routes/invite.js
          node -c server/middlewares/auth.js
          echo "Синтаксис корректен"
  e2e-tests:
    name: Запуск Playwright тестов (API и UI)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Установка зависимостей проекта
        run: npm ci
      - name: Установка браузеров Playwright
        run: npx playwright install --with-deps chromium
      - name: Запуск тестов Playwright
        run: npx playwright test
      - name: Сохранение отчета Playwright при ошибках
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
